<header class="site-header" id="hdr">
  <div class="wrap">
    <div class="bar">
      <a class="logo" href="#home" data-link aria-label="NXEO home"><img src="{{nxeo_light}}" alt="nxeo"></a>
      <nav class="nav" aria-label="Hoofdmenu">
        <a href="#home" data-link data-nav="home">Hoe het werkt</a>
        <a href="#prijzen" data-link data-nav="prijzen">Prijzen</a>
        <a href="#over" data-link data-nav="over">Over</a>
        <a href="#contact" data-link data-nav="contact">Contact</a>
      </nav>
      <div class="hdr-actions">
        <a class="lang" href="{{langhref}}" hreflang="{{langcode}}" aria-label="{{langaria}}">{{langlabel}}</a>
        <a class="btn btn-ghost-light hdr-contact" href="#sales" data-link>Plan een gesprek</a>
        <a class="btn hdr-cta" href="#aanvraag" data-link>Start met NXEO</a>
      </div>
      <button class="burger" id="burger" aria-label="Menu openen"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </div>
</header>
<div class="mobile-nav" id="mnav">
  <div class="top"><img src="{{nxeo_light}}" alt="nxeo" style="height:22px"><button class="close" id="mclose" aria-label="Menu sluiten"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <a class="big" href="#home" data-link>Hoe het werkt</a>
  <a class="big" href="#prijzen" data-link>Prijzen</a>
  <a class="big" href="#over" data-link>Over</a>
  <a class="big" href="#contact" data-link>Contact</a>
  <a class="btn btn-white" href="#aanvraag" data-link style="justify-self:start">Start met NXEO</a>
  <a href="{{langhref}}" hreflang="{{langcode}}" style="font-weight:600;letter-spacing:.06em;opacity:.8">{{langswitch}}</a>
</div>
