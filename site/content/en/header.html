<header class="site-header" id="hdr">
  <div class="wrap">
    <div class="bar">
      <a class="logo" href="#home" data-link aria-label="NXEO home"><img src="{{nxeo_white}}" alt="nxeo"></a>
      <nav class="nav" aria-label="Main menu">
        <a href="#home" data-link data-nav="home">How it works</a>
        <a href="#prijzen" data-link data-nav="prijzen">Pricing</a>
        <a href="#over" data-link data-nav="over">About</a>
        <a href="#contact" data-link data-nav="contact">Contact</a>
      </nav>
      <div class="hdr-actions">
        <a class="lang" href="{{langhref}}" hreflang="{{langcode}}" aria-label="{{langaria}}">{{langlabel}}</a>
        <a class="btn btn-ghost-light hdr-contact" href="#sales" data-link>Book a call</a>
        <a class="btn hdr-cta" href="#aanvraag" data-link>Start with NXEO</a>
      </div>
      <button class="burger" id="burger" aria-label="Open menu"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </div>
</header>
<div class="mobile-nav" id="mnav">
  <div class="top"><img src="{{nxeo_white}}" alt="nxeo" style="height:22px"><button class="close" id="mclose" aria-label="Close menu"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <a class="big" href="#home" data-link>How it works</a>
  <a class="big" href="#prijzen" data-link>Pricing</a>
  <a class="big" href="#over" data-link>About</a>
  <a class="big" href="#contact" data-link>Contact</a>
  <a class="btn btn-white" href="#aanvraag" data-link style="justify-self:start">Start with NXEO</a>
  <a href="{{langhref}}" hreflang="{{langcode}}" style="font-weight:600;letter-spacing:.06em;opacity:.8">{{langswitch}}</a>
</div>
